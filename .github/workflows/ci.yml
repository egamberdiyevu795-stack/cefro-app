# Normal validation: lint, typecheck, unit/integration tests, build, browser tests.
#
# Deliberately free of secrets and of any real provider call: the unit/integration tests use fakes, and
# the browser tests run against the mock providers. The live Gemini validation is a separate, manual
# workflow (live-evaluation.yml) because it spends API budget and needs the GEMINI_API_KEY secret.
#
# It is also the first stage of the production pipeline (deploy.yml calls it with `workflow_call`), so a push to main
# is validated by exactly this job and by nothing weaker. Pushes to main are not validated twice: there is no plain
# `push` trigger, because deploy.yml runs this workflow for main.
#
# Actions-minutes budget: feature branches are validated by their pull_request run (a branch push without a PR runs
# nothing; use "Run workflow" if needed), docs-only changes are skipped, and everything runs in ONE job so checkout +
# npm ci happen once. A commit message containing [skip ci] skips the run (GitHub built-in).
name: CI

on:
  pull_request:
    paths-ignore: ['**.md', 'docs/**', '.gitignore', 'LICENSE']
  workflow_call:
  workflow_dispatch:

# A newer push to the same branch makes the older run pointless.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Read-only token; no secrets are referenced anywhere in this file.
permissions:
  contents: read

jobs:
  validate:
    name: Lint, typecheck, test, build, browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the migration check compares with the commit before this change
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Migrations reach the production database before the new code is deployed, so they must be backward compatible
      # and applied migrations must never be edited. No database access, no secrets.
      - name: Migration safety (journal, immutability of applied migrations, backward compatibility)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/ci/check-migrations.mjs --base "$BASE_SHA"
      # The speech activity guard decodes audio with ffmpeg; its tests must run, not be skipped.
      - name: Install ffmpeg (needed by the speech activity guard tests)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: npm run lint
      - run: npm run typecheck
      - name: Unit and integration tests (includes the migration tests)
        run: npm test
        env:
          REQUIRE_FFMPEG: "1"
      # Browser tests (mock providers) run against `next dev`, before the production build touches .next.
      - name: Cache the Playwright browser
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install Chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Install Chromium system dependencies (browser restored from cache)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - name: Browser tests
        run: npm run test:e2e
      - name: Keep the Playwright traces of a failed run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
      - name: Build
        run: npm run build
