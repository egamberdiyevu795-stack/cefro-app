# Production pipeline: validate -> check the Vercel project -> migrate the production database -> deploy.
#
#   ci        lint, typecheck, unit/integration tests (incl. migration tests), build, browser tests   (no secrets)
#   preflight secrets present, Vercel project settings safe, this commit is still the head of main
#   migrate   `npm run db:migrate` against the production Turso database (idempotent, one run at a time)
#   deploy    `vercel deploy --prod` of exactly this commit
#
# Each stage needs the one before it, so a failed check, a failed migration or a stale run stops everything after it.
# Vercel's own automatic deployment of `main` is switched off in vercel.json; this workflow is the only thing that
# deploys production. Preview deployments (every other branch and pull request) stay with Vercel's Git integration:
# they never run this workflow, never receive these secrets and never migrate anything.
#
# One-time setup: docs/DEPLOY_VERCEL.md ("Automatic deployment"). Secrets live in the `production` GitHub environment:
#   TURSO_DATABASE_URL, TURSO_AUTH_TOKEN, VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID
# They are passed to steps only through `env:` (never interpolated into a script), and GitHub masks their values in logs.
name: Deploy production

on:
  push:
    branches: [main]
  workflow_dispatch: # re-run after fixing a secret or a Vercel setting; only the head of main is ever deployed

# Read-only token. Nothing here writes to the repository.
permissions:
  contents: read

# One production run at a time, queued (never cancelled halfway through a migration or a deployment). While one run is
# active, only the newest waiting run is kept: older waiting runs are superseded by it.
concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  ci:
    name: Validate
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci.yml

  preflight:
    name: Preflight
    needs: ci
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check the secrets are configured (names only, values are never printed)
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          missing=0
          for name in TURSO_DATABASE_URL TURSO_AUTH_TOKEN VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::Secret $name is not set in the 'production' environment (Settings > Environments > production). Nothing was migrated or deployed."
              missing=1
            fi
          done
          exit $missing

      - name: This commit is still the head of main
        run: |
          git fetch --quiet origin main
          if [ "$(git rev-parse FETCH_HEAD)" != "$GITHUB_SHA" ]; then
            echo "::error::main has moved on since this run started ($GITHUB_SHA is no longer its head). Only the head of main is migrated and deployed; the newer commit has its own run."
            exit 1
          fi

      - name: Vercel project is safe to deploy to (database credentials Production-only, production branch is main)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          CEFRO_ALLOW_PREVIEW_TURSO: ${{ vars.CEFRO_ALLOW_PREVIEW_TURSO }}
        run: node scripts/ci/check-vercel-project.mjs

  migrate:
    name: Migrate production database
    needs: preflight
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    # A second guard on top of the workflow-level group: no two migrations ever run at once.
    concurrency:
      group: production-database-migration
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Only what the migration needs: no dev tools, and no install scripts (ffmpeg-static would download a binary).
      - run: npm ci --omit=dev --ignore-scripts
      - name: npm run db:migrate
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: npm run db:migrate

  deploy:
    name: Deploy to Vercel (production)
    needs: migrate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Still the head of main
        run: |
          git fetch --quiet origin main
          if [ "$(git rev-parse FETCH_HEAD)" != "$GITHUB_SHA" ]; then
            echo "::error::main has moved on since the migration; not deploying a superseded commit. The newer commit has its own run."
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Deploys exactly the checked-out commit; Vercel builds it (`npm run vercel-build` = `next build`, no database access).
      # The CLI reads VERCEL_TOKEN, VERCEL_ORG_ID and VERCEL_PROJECT_ID from the environment.
      - name: vercel deploy --prod
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          url="$(npx --yes vercel@63.1.0 deploy --prod --yes --meta githubCommitSha="$GITHUB_SHA")"
          echo "Production deployment: $url"
          {
            echo "### Production deployed"
            echo "Commit \`$GITHUB_SHA\`"
            echo "Deployment: $url"
          } >> "$GITHUB_STEP_SUMMARY"
