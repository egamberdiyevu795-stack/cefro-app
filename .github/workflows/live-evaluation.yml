# Live evaluation against a REAL evaluation provider (Gemini by default, or Anthropic), run on demand.
#
# Why this exists: the secret below can only be read by GitHub Actions, and the
# development sandbox cannot reach the Gemini API. Running here validates the
# evaluator on the Part 2 band anchors and the S01–S15 samples (each repeated) and uploads a review report.
#
# Setup (once): Repository → Settings → Secrets and variables → Actions →
# New repository secret, name: GEMINI_API_KEY.
#
# Security: manual trigger only (never pull_request, so forks cannot reach the
# secret); read-only token; the key is exposed only to the one step that needs
# it and GitHub masks it in logs. The report contains model output for the
# synthetic samples only, no student data.
name: Live evaluation (Gemini)

on:
  workflow_dispatch:
    inputs:
      samples:
        description: "Optional comma-separated id prefixes (e.g. A2,S15; P1 = injection check, RETRY = retry pair). Empty = all."
        required: false
        default: ""
      provider:
        description: "Evaluation provider to validate (needs the matching repository secret)."
        type: choice
        options: [gemini, anthropic]
        required: false
        default: gemini
      model:
        description: "Optional model override for the chosen provider. Empty = that provider's configured default."
        required: false
        default: ""
      thinking_level:
        description: "Gemini thinking level (minimal / low / medium / high). Empty = configured default (high)."
        required: false
        default: ""
      max_tokens:
        description: "Gemini max output tokens (4000–65000). Empty = configured default."
        required: false
        default: ""
      repeat:
        description: "Evaluate every sample this many times and report any band that changes between runs."
        required: false
        default: "3"

# Starting a new run of this workflow on the same ref cancels the older one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Check the secret is configured (without printing it)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PROVIDER: ${{ inputs.provider }}
        run: |
          name="GEMINI_API_KEY"; [ "$PROVIDER" = "anthropic" ] && name="ANTHROPIC_API_KEY"
          if [ -z "${!name}" ]; then
            echo "::error::Repository secret $name is not set (Settings → Secrets and variables → Actions). Real $PROVIDER validation NOT RUN."
            exit 1
          fi

      - name: Run the live evaluation
        env:
          EVALUATION_PROVIDER: ${{ inputs.provider }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          EVAL_SAMPLES: ${{ inputs.samples }}
          # Only the chosen provider's override is set; the other stays empty (= default).
          GEMINI_EVALUATION_MODEL: ${{ inputs.provider == 'gemini' && inputs.model || '' }}
          ANTHROPIC_EVALUATION_MODEL: ${{ inputs.provider == 'anthropic' && inputs.model || '' }}
          GEMINI_THINKING_LEVEL: ${{ inputs.thinking_level }}
          GEMINI_EVALUATION_MAX_TOKENS: ${{ inputs.max_tokens }}
          EVAL_REPEAT: ${{ inputs.repeat }}
        run: npm run eval:live

      # The artifact host may be unreachable from some environments, so also print the report in
      # the log. Output is wrapped in stop-commands so model-generated text can never be
      # interpreted as workflow commands. The report holds synthetic samples and model output only.
      - name: Print the review report in the log
        if: always()
        run: |
          TOKEN="stop-$(openssl rand -hex 12)"
          echo "::stop-commands::$TOKEN"
          for f in eval-reports/*.md; do echo "=== REPORT $f ==="; cat "$f"; echo "=== END REPORT ==="; done
          echo "::$TOKEN::"

      - name: Upload the review report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-evaluation-report
          path: eval-reports/
          if-no-files-found: warn
          retention-days: 30
