# REAL pipeline validation: transcription (Gemini or OpenAI), evaluation (Gemini or Anthropic), and the two together, including one
# browser flow. Manual only, and separate from CI because it spends API budget and needs secrets.
#
# Setup (once): Repository → Settings → Secrets and variables → Actions → New repository secret:
#   OPENAI_API_KEY   (OpenAI transcription, and text-to-speech when present)
#   GEMINI_API_KEY   (evaluation with Gemini; also used by live-evaluation.yml)
#   ANTHROPIC_API_KEY (evaluation with Anthropic, when the `evaluation_provider` input is anthropic)
#
# What it runs, in order (each step's result is reported even if an earlier one fails):
#   1. eval:transcription:controlled  controlled audio → OpenAI transcription (fidelity, fillers, silence, formats)
#   2. eval:pipeline                  audio → createAttempt → OpenAI → Gemini → gate → database → read back (+ retry pair)
#   3. test:e2e:live                  one browser flow with a fake microphone playing speech (real recorder path)
#
# The test audio is synthetic speech (text-to-speech from OpenAI when its key is present, else Gemini; encoded with
# ffmpeg), not real learners.
#
# Security: manual trigger only (never pull_request, so forks cannot reach the secrets); read-only token; the
# keys are exposed only to the steps that need them, GitHub masks them in logs, and the reports contain only
# synthetic transcripts and model output.
name: Live pipeline validation

on:
  workflow_dispatch:
    inputs:
      browser:
        description: "Also run the real-provider browser flow (one extra transcription + evaluation)."
        type: boolean
        required: false
        default: true
      transcription_provider:
        description: "Speech-to-text provider (needs its repository secret). gemini = temporary, until OpenAI is available."
        type: choice
        options: [gemini, openai]
        required: false
        default: gemini
      evaluation_provider:
        description: "Evaluation provider for steps 2 and 3 (needs its repository secret)."
        type: choice
        options: [gemini, anthropic]
        required: false
        default: gemini
      transcription_samples:
        description: "Optional comma-separated sample prefixes for step 1 (e.g. T02,T06,T07). Empty = all."
        required: false
        default: ""
      samples:
        description: "Optional comma-separated pipeline sample prefixes (e.g. P1,P2). Empty = all."
        required: false
        default: ""

# Starting a new run of this workflow on the same ref cancels the older one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Check the secrets are configured (without printing them)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          EVAL_PROVIDER: ${{ inputs.evaluation_provider }}
          STT_PROVIDER: ${{ inputs.transcription_provider }}
        run: |
          missing=0
          evalkey="GEMINI_API_KEY"; [ "$EVAL_PROVIDER" = "anthropic" ] && evalkey="ANTHROPIC_API_KEY"
          sttkey="GEMINI_API_KEY"; [ "$STT_PROVIDER" = "openai" ] && sttkey="OPENAI_API_KEY"
          for name in $sttkey $evalkey; do
            if [ -z "${!name}" ]; then
              echo "::error::Repository secret $name is not set (Settings → Secrets and variables → Actions)."
              missing=1
            fi
          done
          exit $missing

      - name: Make sure ffmpeg and ffprobe are available
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          fi
          ffmpeg -version | head -1

      - name: Install Chromium (browser flow)
        if: ${{ inputs.browser }}
        run: npx playwright install --with-deps chromium

      - name: 1. Controlled transcription validation (real, provider per input)
        id: transcription
        continue-on-error: true
        env:
          TRANSCRIPTION_PROVIDER: ${{ inputs.transcription_provider }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TRANSCRIPTION_SAMPLES: ${{ inputs.transcription_samples }}
        run: npm run eval:transcription:controlled

      - name: 2. Full pipeline validation (real providers per inputs)
        id: pipeline
        continue-on-error: true
        env:
          TRANSCRIPTION_PROVIDER: ${{ inputs.transcription_provider }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          EVALUATION_PROVIDER: ${{ inputs.evaluation_provider }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          EVAL_SAMPLES: ${{ inputs.samples }}
        run: npm run eval:pipeline

      - name: 3. Real-provider browser flow
        id: browser
        if: ${{ inputs.browser }}
        continue-on-error: true
        env:
          TRANSCRIPTION_PROVIDER: ${{ inputs.transcription_provider }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          EVALUATION_PROVIDER: ${{ inputs.evaluation_provider }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: npm run test:e2e:live

      # The artifact host may be unreachable from some environments, so the reports are also printed in the
      # log, wrapped in stop-commands so model output can never be interpreted as workflow commands.
      - name: Print the reports in the log
        if: always()
        run: |
          TOKEN="stop-$(openssl rand -hex 12)"
          echo "::stop-commands::$TOKEN"
          for f in eval-reports/*.md eval-reports/browser-real-pipeline.json; do [ -f "$f" ] && { echo "=== REPORT $f ==="; cat "$f"; echo "=== END REPORT ==="; }; done
          echo "::$TOKEN::"

      - name: Upload the reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-pipeline-reports
          path: eval-reports/
          if-no-files-found: warn
          retention-days: 30

      - name: Fail the run if any validation step failed
        if: always()
        run: |
          echo "transcription: ${{ steps.transcription.outcome }}"
          echo "pipeline:      ${{ steps.pipeline.outcome }}"
          echo "browser:       ${{ steps.browser.outcome }}"
          if [ "${{ steps.transcription.outcome }}" != "success" ] || [ "${{ steps.pipeline.outcome }}" != "success" ] || { [ "${{ inputs.browser }}" = "true" ] && [ "${{ steps.browser.outcome }}" != "success" ]; }; then
            exit 1
          fi
