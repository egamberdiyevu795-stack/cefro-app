# TEMPORARY (branch claude/part1-2-picture-tasks only; deleted before the PR is merged).
# 1. Makes the question audio of the five new Part 1.2 tasks with the project's Piper voice and commits it back.
# 2. Re-runs the three Part 1.2 anchors on the real Gemini evaluator (evaluator 3.8.1 rule change) and prints the report.
name: Part 1.2 tools (temporary)

on:
  push:
    branches: [claude/part1-2-picture-tasks]
    paths: [.github/workflows/part12-tools.yml]

concurrency:
  group: part12-tools
  cancel-in-progress: false

jobs:
  audio:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Piper, the voice and ffmpeg
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
          python -m venv /tmp/tts && /tmp/tts/bin/pip install -q piper-tts
          curl -sSL -o /tmp/voice.tgz https://github.com/rhasspy/piper/releases/download/v0.0.2/voice-en-us-libritts-high.tar.gz
          mkdir -p /tmp/voice && tar xzf /tmp/voice.tgz -C /tmp/voice && ls /tmp/voice
      - name: Make the audio of the five new tasks
        env:
          PIPER_BIN: /tmp/tts/bin/piper
          PIPER_MODEL: /tmp/voice/en-us-libritts-high.onnx
        run: |
          for slug in indoor-outdoor-sports plane-or-train healthy-or-fast-food online-or-classroom board-games-or-tv; do
            ONLY="b1-part1-2-$slug/v1/" node scripts/make-part1-question-audio.mjs
          done
          ls -la public/audio/speaking/part1/*/v1/ | head -60
      - name: Commit the audio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/audio/speaking/part1
          git commit -m "content: Part 1.2 question audio for the five new tasks (Piper, same voice and settings)"
          git push

  anchors:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Part 1.2 anchors on the real evaluator
        env:
          EVALUATION_PROVIDER: gemini
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          EVAL_P1_ANCHORS: "1"
          EVAL_P1_ONLY: 1.2-low,1.2-middle,1.2-high
          EVAL_STREAM: "1"
          EVAL_REPEAT: "2"
        run: npx vitest run --config vitest.live.config.mts test/live/part1-anchors.live.test.ts
      - name: Print the report
        if: always()
        run: |
          TOKEN="stop-$(openssl rand -hex 12)"
          echo "::stop-commands::$TOKEN"
          for f in eval-reports/*; do echo "=== REPORT $f ==="; head -c 20000 "$f"; echo; echo "=== END ==="; done
          echo "::$TOKEN::"
