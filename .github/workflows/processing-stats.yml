# How long scoring takes in production (scripts/live-processing-stats.mjs): read-only queries, aggregates only, so the
# public log never holds user data. Manual only ("Run workflow"); uses the production environment's database secrets.
name: Processing stats

on:
  workflow_dispatch:
    inputs:
      days:
        description: How many days back
        default: "14"

permissions:
  contents: read

jobs:
  stats:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Production dependencies only, no install scripts and no build (as deploy.yml's migration check).
      - run: npm ci --omit=dev --ignore-scripts
      - name: Scoring times
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          DAYS: ${{ inputs.days }}
        run: node scripts/live-processing-stats.mjs "$DAYS"
