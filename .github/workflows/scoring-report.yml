# Owner's scoring report for PRODUCTION (manual). Read-only: SELECT queries only, prints counts only (no ids, names,
# emails, transcripts or times). Answers two questions (scripts/scoring-report.mjs, docs/v1-plan.md section 0):
#   1. Is AI scoring working? (attempts scored by a real model, without an AI score, failed and why)
#   2. Does the app agree with the teacher? (teacher Agree / Choose level vs the app's band, per part, and whole mocks)
# Uses the production environment's TURSO_* secrets, the same ones the deploy pipeline uses.
name: Scoring report

on:
  workflow_dispatch:
    inputs:
      days:
        description: "How many days of attempts to count for question 1 (ratings are always all time)."
        type: string
        default: "30"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  report:
    name: Scoring report (read-only)
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --omit=dev --ignore-scripts
      - name: npm run stats:scoring
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          SCORING_REPORT_DAYS: ${{ inputs.days }}
        run: npm run stats:scoring
