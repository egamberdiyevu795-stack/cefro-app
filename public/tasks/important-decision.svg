  <!-- left destination: a small house among trees -->
  <circle cx="34" cy="176" r="26" fill="#7db174"/>
  <rect x="58" y="160" width="58" height="42" fill="#f3e3c3"/>
  <path d="M52 162 L87 132 L122 162Z" fill="#c96f53"/>
