<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" role="img" aria-labelledby="t d">
  <title id="t">A young man at a fork in a path</title>
  <desc id="d">Original illustration made for CEFRO, released under CC0 1.0. A young man stands where a path splits in two, one hand on his chin, thinking. One path leads to a small house among trees, the other to a town with tall buildings. A signpost with two blank boards points both ways.</desc>
