  <rect x="64" y="170" width="10" height="10" fill="#bcdcef"/>
  <rect x="100" y="170" width="10" height="10" fill="#bcdcef"/>
  <circle cx="140" cy="180" r="22" fill="#8fc185"/>
  <!-- right destination: a town -->
  <rect x="352" y="132" width="34" height="74" fill="#a3b1c7"/>
  <rect x="388" y="104" width="40" height="102" fill="#8f9fb8"/>
  <rect x="430" y="146" width="36" height="60" fill="#b8c4d6"/>
