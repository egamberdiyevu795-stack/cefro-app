    <rect x="396" y="114" width="8" height="10"/><rect x="412" y="114" width="8" height="10"/>
    <rect x="396" y="134" width="8" height="10"/><rect x="412" y="134" width="8" height="10"/>
    <rect x="396" y="154" width="8" height="10"/><rect x="412" y="154" width="8" height="10"/>
    <rect x="396" y="174" width="8" height="10"/><rect x="412" y="174" width="8" height="10"/>
    <rect x="438" y="156" width="7" height="9"/><rect x="452" y="156" width="7" height="9"/>
    <rect x="438" y="174" width="7" height="9"/><rect x="452" y="174" width="7" height="9"/>
